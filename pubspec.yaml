name: mini_music_player
description: "A Music Player Flutter Project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  file_picker: ^10.3.3
  permission_handler: ^12.0.1
  flutter_svg: ^2.2.1
  audio_service: ^0.18.15
  just_audio: ^0.10.5
  on_audio_query: ^2.9.0
  device_info_plus: ^12.1.0
  audio_video_progress_bar: ^2.0.3
  path_provider: ^2.1.3
  audio_session: ^0.2.2
  rxdart: ^0.28.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/ic_launcher.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#060606"
  image: assets/images/ic_splash.png
  android: true
  ios: true

  android_12:
    image: "@drawable/ic_splash_12"
    color: "#060606"
