name: mini_music_player
description: "A Music Player Flutter Project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  audioplayers: ^6.5.1
  file_picker: ^10.3.3
  permission_handler: ^12.0.1
  flutter_svg: ^2.2.1
  audio_service: ^0.18.18
  just_audio: ^0.10.5
  on_audio_query: ^2.9.0
  device_info_plus: ^12.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
  - assets/images/

